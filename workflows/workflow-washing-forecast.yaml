id: 74416d70-e483-4b4c-8b83-caef7e88ab36
name: washing-forecast
description: >-
  Fetches and scores today's washing-drying forecast. Not scheduled via a
  persistent `swamp serve` trigger — the production schedule (twice in the
  morning, twice in the afternoon/evening) runs through the
  swamp-workflow-can-i-hang-my-washing-out.timer systemd unit, which starts
  an ephemeral `swamp serve` per run (see run-via-serve.sh). This workflow
  definition is for manual runs (`swamp workflow run washing-forecast`)
  and testing.
tags: {}
jobs:
  - name: main
    description: Fetch and score today's washing-drying forecast
    steps:
      - name: forecast
        description: Fetch the forecast and score morning/afternoon drying conditions
        task:
          type: model_method
          modelIdOrName: washing
          methodName: forecast
        dependsOn: []
        weight: 0
        allowFailure: false
    dependsOn: []
    weight: 0
version: 1
